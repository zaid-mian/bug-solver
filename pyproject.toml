[project]
name = "bug-solver"
version = "0.1.0"
description = "Autonomous bug-fixing agent built on LangGraph: plans a fix, writes code, runs tests, evaluates, and opens a PR."
authors = [
    { name = "Sawyer Anderson" },
]
maintainers = [
    { name = "Muhammad Zaid Tahir" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "typer>=0.9.0",
    "GitPython>=3.1.0",
    "PyGithub>=2.1.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
bugsolver = "cli:cli"

[build-system]
requires = ["setuptools>=73.0.0"]
build-backend = "setuptools.build_meta"

# The codebase imports sibling directories as top-level packages
# (e.g. `from constants import Status`, `from agent.graph import app`),
# so `src/` itself is the package root.
[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
